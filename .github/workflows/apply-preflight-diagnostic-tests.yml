name: Apply tester diagnostic implementation
on:
  pull_request:
    types: [opened, reopened]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'diag/v244-tester-preflight' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/v244-tester-preflight
          fetch-depth: 0
      - name: Apply diagnostics and validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_tester_diagnostic.py
          python3 tests/run_all.py
          python scripts/finalize_tester_diagnostic.py
          rm -f .github/workflows/apply-preflight-diagnostic-tests.yml scripts/apply_tester_diagnostic.py scripts/finalize_tester_diagnostic.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'diag: add tester-only status diagnostics'
          git push origin HEAD:diag/v244-tester-preflight
