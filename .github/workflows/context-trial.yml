name: Context trial offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  context-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run classifier, privacy, audit and replay tests (no API)
        run: python3 -B -m unittest discover -s tests -p test_context_trial.py
      - name: Confirm unchanged routing fixture
        run: python3 -B .agents/skills/model-orchestrator/scripts/evaluate_routing.py
      - name: Parse diagnostic Python sources
        run: python3 -B -c "import ast,pathlib; files=list(pathlib.Path('tools/context_trial').glob('*.py')); [ast.parse(p.read_text(encoding='utf-8')) for p in files]; print('PASS',len(files),'diagnostic modules')"
