name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare current-run diagnostics
        shell: bash
        run: |
          rm -f \
            verification/cpp_diagnostics.txt \
            verification/integration_results.json \
            verification/json_results.json \
            verification/source_audit.json \
            verification/stats_results.json
          : > verification/ci_run.log

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check toolchain
        run: |
          python --version
          g++ --version

      - name: Run shipped offline validation
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py'
          python tests/run_all.py 2>&1 | tee verification/ci_run.log

      - name: Upload validation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: offline-validation-diagnostics
          path: |
            verification/ci_run.log
            .validation/*.json
            .validation/*.txt
            .validation/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Only the two native-dependent gates are delegated. Python/static/scope and
  # MetaEditor remain required locally for authoritative release validation.
  native-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      # Preserve Git blob bytes across Windows checkout (no CRLF conversion).
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact checkout
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw 'Checkout SHA mismatch' }
          if (git status --porcelain) { throw 'Checkout is not clean' }
          git ls-files src tests | ForEach-Object {
            if ((git hash-object --no-filters $_) -ne (git rev-parse "HEAD:$_")) {
              throw "Checkout bytes differ from commit: $_"
            }
          }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up UCRT64 GCC
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: ABI and native deterministic gates
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH = "$env:MSYS2_LOCATION\ucrt64\bin;$env:PATH"
          New-Item -ItemType Directory -Force .validation | Out-Null
          g++ --version | Out-File .validation/toolchain.txt
          g++ -dumpmachine | Out-File -Append .validation/toolchain.txt
          python --version | Out-File -Append .validation/toolchain.txt
          python -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/run_all.py --native-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload native evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-${{ env.EXPECTED_SHA }}-${{ github.run_attempt }}
          path: |
            .validation/gate_result.json
            .validation/integration_results.json
            .validation/json_results.json
            .validation/cpp_diagnostics.txt
            .validation/toolchain.txt
            .validation/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
