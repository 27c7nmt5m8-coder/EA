name: Apply integrated tester fix
on:
  push:
    branches:
      - fix/v244-tester-connection-integrated
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed patch, validate, and commit
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/integrated.patch
          git apply --check /tmp/integrated.patch
          git apply /tmp/integrated.patch
          python3 tests/run_all.py
          rm .github/workflows/apply-integrated-fix.yml
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          paths=subprocess.check_output(['git','ls-files'], text=True).splitlines()
          lines=[]
          for name in sorted(paths):
              if name=='SHA256SUMS.txt':
                  continue
              p=Path(name)
              if not p.is_file():
                  continue
              lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {name}")
          Path('SHA256SUMS.txt').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --check
          git status --short
          git commit -m 'fix: integrate Strategy Tester connection handling'
          git push origin HEAD:fix/v244-tester-connection-integrated
